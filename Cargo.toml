[package]
name = "ecsimple"
version = "0.1.6"
edition = "2021"
rust-version = "1.59.0"
author = ["jeppeter <jeppeter@gmail.com>"]
description = """
Rust simple implementation for Elliptic Curve Cryptography
"""
license = "MIT/Apache-2.0"

repository = "https://github.com/jeppeter/ecsimple"

