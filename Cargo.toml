rand = "^0.8.5"
#asn1obj = { path = "../asn1obj/asn1obj"}
#asn1obj_codegen = { path = "../asn1obj/asn1obj_codegen"}
asn1obj = "^0.1.20"
asn1obj_codegen = "^0.1.6"
serde_json = "^1.0.42"
sm3  = "^0.4.2"

[features]
debug_mode = []
